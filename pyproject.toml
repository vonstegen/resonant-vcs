[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resonant-vcs"
version = "0.1.0"
description = "A human-AI collaborative Version Control System for all skill levels"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Andre VonStegen", email = "andrevonstegen@gmail.com"}
]
keywords = ["vcs", "version-control", "ai", "collaborative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
ai = [
    "httpx>=0.25.0",
    "aiohttp>=3.8.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
]
all = [
    "resonant-vcs[dev,ai,web]"
]

[project.scripts]
avcs = "resonant_vcs.cli.main:cli"

[project.urls]
Homepage = "https://github.com/vonstegen/resonant-vcs"
Documentation = "https://github.com/vonstegen/resonant-vcs#readme"
Repository = "https://github.com/vonstegen/resonant-vcs"
Issues = "https://github.com/vonstegen/resonant-vcs/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=resonant_vcs --cov-report=term-missing --cov-report=html"
